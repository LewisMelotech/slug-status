{% extends 'base.html' %}

{% load bootstrap4 %}
{% load i18n %}

{% block content %}

<h4>{% trans 'Change password' %}</h4>

<div class="col-md-5 col-lg-5 p-0">
  <form method="POST" action="{% url 'account_change_password' %}">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button class="btn btn-primary" type="submit">{% trans 'Change password' %}</button>
  </form>
</div>

{% endblock %}
